[package]
name = "epubsync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Library, metadata, and Kobo sync for EpubSync"
links = "kepubshim"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
epubsync-epub = { path = "../epubsync-epub" }
human_name = "2.0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
readsight = "1.0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
unicode-normalization = "0.1.25"

[dev-dependencies]
epubsync-epub = { path = "../epubsync-epub", features = ["fixtures"] }
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
