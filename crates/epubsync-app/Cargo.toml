[package]
name = "epubsync-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EpubSync library viewer"

[[bin]]
name = "epubsync-app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
epubsync-core = { path = "../epubsync-core" }
htmd = "0.5.5"
iced = { version = "0.14.0", features = ["image", "markdown"] }
opener = "0.8.5"
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3"
epubsync-epub = { path = "../epubsync-epub", features = ["fixtures"] }
