[package]
name = "epubsync-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EpubSync command line"

[[bin]]
name = "epubsync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
epubsync-core = { path = "../epubsync-core" }
htmd = "0.5.5"
libc = "0.2.189"
opener = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
